name: PROS Quality Checks

on:
  push:
    branches:
      - refactor/**
  pull_request:
    branches:
      - main
      - refactor/**

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)
      - name: Check browser smoke test syntax
        run: node --check tests/browser-smoke.cjs
      - name: Check local assets and script order
        run: node tests/structure-check.mjs

  browser-smoke:
    needs: static-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve static site for browser tests
        run: python3 -m http.server 4173 --directory . > /tmp/pros-http.log 2>&1 &
      - name: Test storefront on mobile and desktop
        env:
          PROS_PREVIEW_URL: http://127.0.0.1:4173/
        run: node tests/browser-smoke.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pros-browser-smoke
          path: artifacts/*.png
          if-no-files-found: ignore
